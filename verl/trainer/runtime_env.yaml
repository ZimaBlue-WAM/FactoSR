working_dir: ./
excludes: ["/.git/"]
env_vars:
  TASK_QUEUE_ENABLE: "1"
  HCCL_EXEC_TIMEOUT: "3600"
  HCCL_CONNECT_TIMEOUT: "3600"
  VLLM_ASCEND_ENABLE_MATMUL_ALLREDUCE: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "0"
  TORCH_NCCL_BLOCKING_WAIT: "1"
  TORCH_MULTIPROCESSING_SHARING_STRATEGY: "file_system"
  NCCL_IB_DISABLE: "0"
